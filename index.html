<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFC Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        
        h1 { margin-bottom: 40px; color: #0f172a; text-transform: uppercase; letter-spacing: 1px; }

        .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; width: 100%; max-width: 1200px; }
        
        .map-card { 
            background: white; 
            border: 1px solid #cbd5e1; 
            border-radius: 12px; 
            padding: 20px 10px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            gap: 10px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            transition: transform 0.2s; 
            /* Bordo giallo spesso in basso */
            border-bottom: 6px solid #FFCC00; 
            cursor: pointer; 
            text-align: center; 
            height: 140px; 
        }
        .map-card:hover { transform: translateY(-5px); border-bottom-color: #eab308; }
        
        .icon { width: 40px; height: 40px; fill: none; stroke: currentColor; stroke-width: 1.5; margin-top: auto; }
        
        .label { 
            font-size: 13px; 
            font-weight: 700; /* Carattere bold */
            line-height: 1.2; 
            padding-top: 5px;
            /* Linea separatrice rimossa */
        }
        
        @media (max-width: 1000px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    </style>
</head>
<body>

    <h1>AFC</h1>

    <div class="grid">

            <span class="label">Co.Ge.</span>
        </div>

            <span class="label">Co.An.</span>
        </div>

        <div class="map-card" onclick="inviaMessaggioNavigazione('https://diapdemo.formula.it:8282/due/#/home/desktop/AFC%20-%20Banche')">
            <svg class="icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.334A44.86 44.86 0 0 0 12.5 7.5a44.86 44.86 0 0 0-7.5 2.834V21M3 21h18"/></svg>

        <div class="map-card" onclick="inviaMessaggioNavigazione('#')">

            <span class="label">Chiusure</span>
        </div>
    </div>

    <script>
        function inviaMessaggioNavigazione(percorsoTarget) {
            let routePath = percorsoTarget.includes('#') ? percorsoTarget.split('#')[1] : percorsoTarget;
            const payload = { type: 'ROUTER_NAVIGATION', action: 'navigate', url: percorsoTarget, route: routePath };
            window.parent.postMessage(payload, '*');
        }
    </script>
</body>
</html>
